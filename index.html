<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>备货模型V1.1</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        [v-cloak] { display: none; }
        .scroll-area { max-height: 400px; overflow-y: auto; }
        .sidebar { background: #f8fafc; border-right: 1px solid #e2e8f0; height: 100vh; position: fixed; width: 250px; overflow-y: auto;}
        .main-content { margin-left: 250px; padding: 20px; }
        .product-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #e2e8f0; transition: background 0.2s;}
        .product-item:hover { background: #e2e8f0; }
        .product-item.active { background: #cbd5e1; font-weight: bold; border-left: 4px solid #3b82f6;}
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <div id="app" v-cloak>
        
        <div class="sidebar flex flex-col">
            <div class="p-4 bg-blue-600 text-white font-bold text-lg shadow-md">
                📦 SKU 控制中心
            </div>
            <div class="flex-1 scroll-area">
                <div 
                    v-for="(prod, index) in products" 
                    :key="index"
                    class="product-item"
                    :class="{ active: currentProductIndex === index }"
                    @click="switchProduct(index)"
                >
                    <div class="text-sm">{{ prod.sku }}</div>
                    <div class="text-xs text-gray-500 truncate">{{ prod.name }}</div>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200">
                <button class="w-full bg-white border border-gray-300 text-gray-700 text-sm py-2 rounded shadow-sm hover:bg-gray-50">
                    + 导入外部数据源 (敬请期待)
                </button>
            </div>
        </div>

        <div class="main-content space-y-4">
            
            <div class="bg-white p-4 rounded shadow-sm border-l-4 border-blue-500 flex justify-between items-center">
                <div>
                    <h1 class="text-xl font-bold text-gray-800">当前分析：{{ currentProduct.name }} ({{ currentProduct.sku }})</h1>
                    <p class="text-xs text-gray-500 mt-1">惩罚逻辑已修正：长周期预售直接导致销量流失，到货瞬间满血复活。</p>
                </div>
                <div class="flex items-center space-x-2 bg-blue-50 px-3 py-1.5 rounded text-sm">
                    <label class="font-bold text-blue-800">推演日:</label>
                    <input type="date" v-model="startDate" class="bg-transparent font-bold text-blue-900 outline-none">
                </div>
            </div>

            <div class="grid grid-cols-12 gap-4">
                <div class="col-span-12 xl:col-span-4 flex flex-col space-y-4">
                    <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                        <h2 class="text-sm font-bold border-b pb-2 mb-3 text-gray-700">⚙️ 核心参数调整</h2>
                        <div class="grid grid-cols-2 gap-3 text-xs mb-3">
                            <div class="bg-gray-50 p-2 border rounded">
                                <label class="block text-gray-500 mb-1">期初实盘库存</label>
                                <input type="number" v-model.number="currentProduct.initialStock" class="w-full font-bold text-base outline-none bg-transparent">
                            </div>
                            <div class="bg-gray-50 p-2 border rounded">
                                <label class="block text-gray-500 mb-1">日均基础销量</label>
                                <input type="number" v-model.number="currentProduct.baseSales" class="w-full font-bold text-base outline-none bg-transparent">
                            </div>
                            <div class="bg-red-50 p-2 border border-red-100 rounded">
                                <label class="block text-red-600 mb-1">海运周期(天)</label>
                                <input type="number" v-model.number="currentProduct.leadTime" class="w-full font-bold text-base outline-none bg-transparent text-red-700">
                            </div>
                            <div class="bg-orange-50 p-2 border border-orange-100 rounded">
                                <label class="block text-orange-600 mb-1">查缺周期(天)</label>
                                <input type="number" v-model.number="currentProduct.reviewCycle" class="w-full font-bold text-base outline-none bg-transparent text-orange-700">
                            </div>
                            <div class="bg-blue-50 p-2 border border-blue-100 rounded">
                                <label class="block text-blue-600 mb-1">起订量 MOQ</label>
                                <input type="number" v-model.number="currentProduct.moq" class="w-full font-bold text-base outline-none bg-transparent text-blue-700">
                            </div>
                            <div class="bg-green-50 p-2 border border-green-100 rounded">
                                <label class="block text-green-600 mb-1">安全底线(天)</label>
                                <input type="number" v-model.number="currentProduct.safetyDays" class="w-full font-bold text-base outline-none bg-transparent text-green-700">
                            </div>
                        </div>
                        
                        <div class="border-t pt-2 mt-2">
                            <label class="flex items-center text-xs font-bold text-purple-700 mb-1">
                                <input type="checkbox" v-model="currentProduct.enablePresale" class="mr-2"> 允许断货转预售
                            </label>
                            <div v-if="currentProduct.enablePresale" class="flex justify-between items-center text-xs bg-purple-50 p-2 rounded">
                                <span>最大容忍预售天数:</span>
                                <input type="number" v-model.number="currentProduct.maxPresaleDays" class="w-12 text-right bg-transparent border-b border-purple-300 outline-none font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded shadow-sm border border-gray-200 flex-1 flex flex-col">
                        <h2 class="text-sm font-bold border-b pb-2 mb-2 text-gray-700">📝 智能发单日志</h2>
                        <div class="scroll-area flex-1 space-y-2">
                            <div v-if="orderLog.length === 0" class="text-center text-xs text-gray-400 py-4">无发货记录</div>
                            <div v-for="(log, idx) in orderLog" :key="idx" class="p-2 rounded border text-xs" :class="log.type==='Emergency' ? 'bg-red-50 border-red-200' : 'bg-blue-50 border-blue-200'">
                                <div class="flex justify-between font-bold mb-1">
                                    <span>{{ log.date }}</span>
                                    <span :class="log.type==='Emergency' ? 'text-red-600' : 'text-blue-600'">{{ log.qty.toLocaleString() }} 件</span>
                                </div>
                                <div class="flex justify-between text-gray-500 text-[10px]">
                                    <span>{{ log.type === 'Emergency' ? '🚨 紧急避险' : '📅 常规补齐' }}</span>
                                    <span>预计 {{ log.arrival }} 到</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-12 xl:col-span-8 bg-white p-4 rounded shadow-sm border border-gray-200">
                    <div id="mainChart" class="w-full h-[700px]"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function formatYMD(dateObj) {
            let y = dateObj.getFullYear();
            let m = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            let d = dateObj.getDate().toString().padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function addDays(dateStr, days) {
            let date = new Date(dateStr);
            date.setDate(date.getDate() + parseInt(days));
            return formatYMD(date);
        }
        function dayDiff(d1Str, d2Str) {
            return Math.ceil((new Date(d2Str) - new Date(d1Str)) / 86400000);
        }

        new Vue({
            el: '#app',
            data() {
                let todayStr = formatYMD(new Date());
                return {
                    startDate: todayStr,
                    currentProductIndex: 0,
                    // 模拟多产品数据源
                    products: [
                        {
                            sku: 'SKU-A-001', name: '爆款蓝牙耳机',
                            initialStock: 500, baseSales: 120, leadTime: 60, reviewCycle: 15, safetyDays: 20, moq: 5000,
                            enablePresale: true, maxPresaleDays: 25, monthlyGrowthRate: 5,
                            inTransit: [{ arrivalDate: addDays(todayStr, 20), qty: 5000 }]
                        },
                        {
                            sku: 'SKU-B-002', name: '长尾手机壳',
                            initialStock: 8000, baseSales: 30, leadTime: 90, reviewCycle: 45, safetyDays: 45, moq: 10000,
                            enablePresale: false, maxPresaleDays: 0, monthlyGrowthRate: 0,
                            inTransit: []
                        }
                    ],
                    orderLog: [],
                    chartInstance: null
                }
            },
            computed: {
                currentProduct() {
                    return this.products[this.currentProductIndex];
                },
                simulationData() {
                    let p = this.currentProduct;
                    let localStock = p.initialStock || 0;
                    let pipeline = []; 
                    
                    if (p.inTransit) {
                        for (let batch of p.inTransit) {
                            if (batch.arrivalDate && batch.qty > 0 && batch.arrivalDate >= this.startDate) {
                                pipeline.push({ arrival: batch.arrivalDate, qty: Number(batch.qty) });
                            }
                        }
                    }
                    
                    let xAxisDates = [];
                    let localStockSeries = [], actualSalesSeries = [];
                    let dynamicSafetySeries = [], dynamicMaxCapSeries = [];
                    let markPoints = [], markAreas = [];
                    let orderLog = [];

                    let currentDayObj = new Date(this.startDate);
                    let presaleDuration = 0; // 记录处于预售状态的天数
                    let daysSinceLastOrder = p.reviewCycle; 

                    for (let dayIndex = 0; dayIndex < 200; dayIndex++) {
                        let todayStr = formatYMD(currentDayObj);
                        xAxisDates.push(todayStr);
                        
                        // 简化理论销量计算 (固定增长)
                        let theorySalesToday = p.baseSales * Math.pow(1 + (p.monthlyGrowthRate || 0)/100, dayIndex/30);

                        // === 1. 到货结算 ===
                        let arrivingToday = pipeline.filter(pl => pl.arrival === todayStr).reduce((sum, pl) => sum + pl.qty, 0);
                        if (arrivingToday > 0) {
                            localStock += arrivingToday;
                            markPoints.push({ coord: [todayStr, localStock], symbol: 'rect', symbolSize: [15, 8], symbolOffset: [0, -10], itemStyle: { color: '#4ade80' } });
                            presaleDuration = 0; // 货到了，预售结束，惩罚立刻解除
                        }

                        // === 2. 状态判定与前置惩罚机制 ===
                        let actualSalesToday = 0;
                        let state = 'normal';

                        if (localStock > 0) {
                            actualSalesToday = theorySalesToday;
                            state = 'normal';
                            presaleDuration = 0;
                        } else {
                            if (p.enablePresale) {
                                let nextArrivalArr = pipeline.filter(pl => pl.arrival > todayStr).sort((a,b) => a.arrival > b.arrival ? 1 : -1);
                                if (nextArrivalArr.length > 0 && dayDiff(todayStr, nextArrivalArr[0].arrival) <= p.maxPresaleDays) {
                                    state = 'presale';
                                    presaleDuration++;
                                    
                                    // 核心修正：惩罚前置！预售超过一定天数（如10天），流失率飙升，实际订单腰斩
                                    if (presaleDuration > 10) {
                                        actualSalesToday = theorySalesToday * 0.5; // 预售太久，客户跑了
                                        markAreas.push([{ xAxis: todayStr, itemStyle: { color: 'rgba(239, 68, 68, 0.1)' } }, { xAxis: addDays(todayStr, 1) }]); // 浅红色表示流失
                                    } else {
                                        actualSalesToday = theorySalesToday; // 刚开始预售，大家还能等
                                    }
                                } else {
                                    state = 'stopped';
                                }
                            } else {
                                state = 'stopped';
                            }

                            if (state === 'stopped') {
                                actualSalesToday = 0; 
                                localStock = 0; // 彻底停售不欠账
                                presaleDuration = 0;
                            }
                        }

                        if (state !== 'stopped') localStock -= actualSalesToday; 
                        
                        localStockSeries.push(localStock);
                        actualSalesSeries.push(actualSalesToday);

                        if (state === 'presale' && presaleDuration <= 10) markAreas.push([{ xAxis: todayStr, itemStyle: { color: 'rgba(253, 186, 116, 0.3)' } }, { xAxis: addDays(todayStr, 1) }]);
                        else if (state === 'stopped') markAreas.push([{ xAxis: todayStr, itemStyle: { color: 'rgba(239, 68, 68, 0.4)' } }, { xAxis: addDays(todayStr, 1) }]);

                        // === 3. 算量引擎 ===
                        let futureDemandLead = 0, futureDemandCycle = 0;
                        for(let j=0; j<p.leadTime; j++) futureDemandLead += p.baseSales * Math.pow(1 + p.monthlyGrowthRate/100, (dayIndex+j)/30);
                        for(let j=0; j<p.reviewCycle; j++) futureDemandCycle += p.baseSales * Math.pow(1 + p.monthlyGrowthRate/100, (dayIndex+p.leadTime+j)/30);
                        
                        let targetSafetyStock = p.baseSales * Math.pow(1 + p.monthlyGrowthRate/100, (dayIndex+p.leadTime)/30) * p.safetyDays;
                        let reorderPoint = futureDemandLead + targetSafetyStock;
                        let maxTargetLevel = futureDemandLead + futureDemandCycle + targetSafetyStock;

                        dynamicSafetySeries.push(targetSafetyStock);
                        dynamicMaxCapSeries.push(maxTargetLevel);

                        let totalInTransit = pipeline.filter(pl => pl.arrival > todayStr).reduce((sum, pl) => sum + pl.qty, 0);
                        let projectedAvailable = localStock + totalInTransit; 

                        let orderQty = 0;
                        let triggerType = '';

                        if (projectedAvailable <= reorderPoint) {
                            orderQty = maxTargetLevel - projectedAvailable;
                            triggerType = 'Emergency';
                        } 
                        else if (daysSinceLastOrder >= p.reviewCycle) {
                            if (projectedAvailable < maxTargetLevel) {
                                orderQty = maxTargetLevel - projectedAvailable;
                                triggerType = 'Scheduled';
                            }
                        }

                        if (orderQty > 0) {
                            orderQty = Math.max(p.moq, Math.ceil(orderQty));
                            let arrivalDate = addDays(todayStr, p.leadTime);
                            pipeline.push({ arrival: arrivalDate, qty: orderQty });
                            
                            orderLog.push({ date: todayStr, type: triggerType, qty: orderQty, arrival: arrivalDate });
                            markPoints.push({
                                coord: [todayStr, localStock],
                                symbol: 'pin', symbolSize: triggerType === 'Emergency' ? 40 : 30, 
                                itemStyle: { color: triggerType === 'Emergency' ? '#dc2626' : '#3b82f6' },
                                label: { formatter: '买', fontSize: 10 }
                            });
                            daysSinceLastOrder = 0;
                        } else {
                            daysSinceLastOrder++;
                        }

                        currentDayObj.setDate(currentDayObj.getDate() + 1);
                    }
                    
                    return { xAxisDates, localStockSeries, actualSalesSeries, dynamicSafetySeries, dynamicMaxCapSeries, markPoints, markAreas, orderLog };
                }
            },
            methods: {
                switchProduct(index) {
                    this.currentProductIndex = index;
                    this.updateChart();
                },
                initChart() {
                    this.chartInstance = echarts.init(document.getElementById('mainChart'));
                    window.addEventListener('resize', () => { this.chartInstance.resize(); });
                },
                updateChart() {
                    let d = this.simulationData;
                    this.orderLog = [...d.orderLog].reverse();

                    let option = {
                        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                        legend: { data: ['实际发生销量', '实盘库存/欠账'], bottom: 0 },
                        grid: { left: '3%', right: '4%', bottom: '10%', top: '5%', containLabel: true },
                        dataZoom: [{ type: 'inside', start: 0, end: 100 }, { type: 'slider', start: 0, end: 100, height: 20, bottom: 30 }],
                        xAxis: { type: 'category', data: d.xAxisDates },
                        yAxis: [
                            { type: 'value', name: '库存/欠账', splitLine: { show: false } },
                            { type: 'value', name: '日销量', position: 'right' }
                        ],
                        series: [
                            {
                                name: '实盘库存/欠账', type: 'line', step: 'end', yAxisIndex: 0,
                                itemStyle: { color: '#0f172a', width: 2 },
                                data: d.localStockSeries, markPoint: { data: d.markPoints }, markArea: { data: d.markAreas }
                            },
                            {
                                name: '实际发生销量', type: 'line', yAxisIndex: 1, symbol: 'none',
                                itemStyle: { color: '#f59e0b', width: 2 },
                                data: d.actualSalesSeries
                            },
                            {
                                name: '安全底线', type: 'line', yAxisIndex: 0, symbol: 'none',
                                itemStyle: { color: '#10b981', type: 'dashed' }, data: d.dynamicSafetySeries
                            },
                            {
                                name: '目标水位', type: 'line', yAxisIndex: 0, symbol: 'none',
                                itemStyle: { color: '#818cf8', type: 'dotted' }, data: d.dynamicMaxCapSeries
                            }
                        ]
                    };
                    this.chartInstance.setOption(option);
                }
            },
            mounted() {
                this.initChart();
                this.updateChart();
            },
            watch: {
                currentProduct: { deep: true, handler() { this.updateChart(); } }
            }
        });
    </script>
</body>
</html>
